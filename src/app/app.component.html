<!-- Global layout shell -->
<div class="flex h-[133.334vh] w-[133.334vw] p-4 gap-4 bg-surface-canvas text-on-surface font-body-md overflow-hidden">
  <!-- Sidebar -->
  <aside class="flex flex-col h-full w-sidebar-width shrink-0 bg-surface-sidebar rounded-3xl overflow-hidden">
    <!-- Brand header -->
    <div class="px-6 py-8">
      <div class="flex items-center gap-3">
        <img
          src="assets/logos/app-icon.png"
          alt="PDF Toolbox"
          class="w-12 h-12 object-contain shrink-0"
        />
        <div class="flex flex-col justify-center">
          <h1 class="text-[22px] font-bold text-text-main leading-tight whitespace-nowrap">PDF Toolbox</h1>
          <p class="text-[12px] font-bold text-text-muted uppercase tracking-widest">Professional Utility</p>
        </div>
      </div>
    </div>

    <!-- Main navigation -->
    <nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
      @for (item of nav; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="nav-active"
          class="nav-item flex items-center gap-4 px-4 py-3 rounded-full text-text-muted hover:text-primary transition-colors cursor-pointer text-body-md"
        >
          <span class="material-symbols-outlined nav-icon" style="font-size:20px;">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- CTA -->
    <div class="p-6">
      <a
        routerLink="/images"
        class="w-full bg-secondary text-white rounded-xl font-bold py-2.5 px-4 flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-lg shadow-secondary/20"
      >
        <span class="material-symbols-outlined" style="font-size:20px;">add</span>
        <span>New Document</span>
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar bg-surface-container-lowest rounded-3xl shadow-soft">
    <router-outlet />
  </main>
</div>
