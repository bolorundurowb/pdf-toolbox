[package]
name = "pdf-toolbox"
version = "0.2.1"
description = "A local, offline PDF tools suite"
authors = ["Winner-Timothy Bolorunduro"]
edition = "2021"

[lib]
name = "pdf_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF + image processing (all local, no network).
# Page rasterisation and text extraction happen in the frontend via pdf.js, so
# there is no native rendering library to bundle and no optional build features.
lopdf = "0.44.0"
image = "0.25"
rand = "0.10.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
