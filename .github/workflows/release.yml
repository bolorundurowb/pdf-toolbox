name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi

          TAG="v${VERSION}"

          # Pre-release if the version contains an alpha, beta, or dev identifier
          # (e.g. 1.0.0-alpha.1, 0.3.0-beta, 0.2.0-dev).
          if echo "$VERSION" | grep -qiE '(^|[.+-])(alpha|beta|dev)([.+-]|$)'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Prerelease: ${PRERELEASE}"

  publish:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libheif-dev \
            patchelf \
            xdg-utils

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install libheif pkg-config

      - name: Install Windows dependencies (libheif via vcpkg)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install libheif:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: PDF Toolbox v${{ needs.prepare.outputs.version }}
          releaseBody: |
            See the assets below to download and install this version.

            **Version:** ${{ needs.prepare.outputs.version }}
            **Platforms:** Windows (x64), Linux (x64), macOS (Intel + Apple Silicon)
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
