name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (default: v<app version> from tauri.conf.json)'
        required: false
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false
      enable_render:
        description: 'Enable the pdfium render feature (Extract → pages as images)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage qpdf (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/stage-qpdf-ci.ps1

      - name: Stage qpdf (Unix)
        if: matrix.platform != 'windows-latest'
        run: bash ./scripts/stage-qpdf-ci.sh

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || 'v__VERSION__' }}
          releaseName: PDF Toolbox v__VERSION__
          releaseBody: |
            See the assets below to download and install this version.

            **Platforms:** Windows (x64), Linux (x64), macOS (Intel + Apple Silicon)

            The Security tool ships with qpdf bundled. Page-to-image export requires
            building with the `render` feature and a pdfium library (not included by default).
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ format('{0}{1}', matrix.args, inputs.enable_render && ' --features render' || '') }}
